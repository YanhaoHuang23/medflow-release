run:
  name: ptb
  seed: 42
paths:
  data_dir: data/processed/ptb_medformer_code_551530_15ch_288
  artifact_root: runs/ptb_seed42
dataset:
  input_dim: 15
  window_size: 288
  num_classes: 2
  feature_names: [ECG01, ECG02, ECG03, ECG04, ECG05, ECG06, ECG07, ECG08, ECG09, ECG10, ECG11, ECG12, ECG13, ECG14, ECG15]
model:
  vq:
    patch_num: [9, 18, 36]
training:
  vq: {iterations: 60000, eval_every: 5000, batch_size: 128, lr: 0.0002}
  flow: {iterations: 60000, eval_every: 5000, batch_size: 128, lr: 0.0002}
sampling:
  batch_size: 128
  tmg:
    enabled: true
    # PTB uses dual-class TMG despite its 5.72:1 class ratio.
    policy: per_class
    target_label: 1
    weight: 0.2
    background: not_target
evaluation:
  timesnet:
    enabled: true
    seeds: [42]
    epochs: 40
    alphas: [1.0]
